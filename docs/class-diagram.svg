<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1540" viewBox="0 0 2100 1540">
<defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#111}.title{font-size:25px;font-weight:bold}.subtitle{font-size:16px}.name{font-size:18px;font-weight:bold}.attr{font-size:13px}.rel{font-size:12px}.box{fill:white;stroke:#222;stroke-width:1.5}.assoc{fill:none;stroke:#333;stroke-width:1.35}.dash{stroke-dasharray:6 5}
</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="white" stroke="#333"/></marker></defs>
<rect width="2100" height="1540" fill="white"/>
<text x="1050" y="34" class="title" text-anchor="middle">CLASS DIAGRAM DATABASE SIMAGANG</text>
<text x="1050" y="58" class="subtitle" text-anchor="middle">Struktur kelas dan relasi foreign key berdasarkan migrasi terbaru</text>
<!-- relations behind the class boxes -->
<g class="assoc">
<path d="M1050 186V228H810V270"/><path d="M930 186V238H350V270"/>
<path d="M810 405V440H1335V270"/><path d="M810 440H1710V270"/>
<path d="M810 405V440H330V475"/><path d="M810 440H790V475"/><path d="M810 440H1250V475"/><path d="M810 440H1710V475"/>
<path d="M650 405V455H1250V475"/><path d="M650 455H790V475"/>
<path d="M1710 405V440H790V475"/>
<path d="M330 610V650H330V685"/><path d="M790 610V650H790V685"/><path d="M1250 610V650H1250V685"/><path d="M1710 610V650H1710V685"/>
</g>
<g class="rel">
<text x="870" y="222">mengajukan</text><text x="510" y="234">division</text>
<text x="1050" y="434">menerbitkan untuk</text><text x="1450" y="434">memiliki riwayat</text>
<text x="490" y="434">punya presensi / logbook / tugas / evaluasi</text>
<text x="470" y="451">divisi tugas</text><text x="910" y="447">verifikator logbook</text><text x="1500" y="435">aktor riwayat</text>
<text x="350" y="664">presensi</text><text x="810" y="664">logbook</text><text x="1270" y="664">tugas</text><text x="1730" y="664">evaluasi</text>
</g>
<!-- UML class boxes: header and attribute compartment -->
<g><rect x="900" y="80" width="300" height="106" class="box"/><line x1="900" y1="116" x2="1200" y2="116" class="assoc"/><text x="1050" y="105" text-anchor="middle" class="name">User</text><text x="912" y="137" class="attr">+ id : bigint {PK}</text><text x="912" y="153" class="attr">+ name, email, role, status_akun</text><text x="912" y="169" class="attr">+ nip, position, division_id {FK}</text></g>
<g><rect x="190" y="270" width="320" height="135" class="box"/><line x1="190" y1="306" x2="510" y2="306" class="assoc"/><text x="350" y="295" text-anchor="middle" class="name">Division</text><text x="202" y="327" class="attr">+ id : bigint {PK}</text><text x="202" y="343" class="attr">+ name, code {UK}</text><text x="202" y="359" class="attr">+ description, quota</text><text x="202" y="375" class="attr">+ users, applications, tasks</text></g>
<g><rect x="650" y="270" width="320" height="135" class="box"/><line x1="650" y1="306" x2="970" y2="306" class="assoc"/><text x="810" y="295" text-anchor="middle" class="name">InternApplication</text><text x="662" y="327" class="attr">+ id : bigint {PK}</text><text x="662" y="343" class="attr">+ user_id, division_id, mentor_id {FK}</text><text x="662" y="359" class="attr">+ tracking_code {UK}, final_status</text><text x="662" y="375" class="attr">+ start_date, end_date, internship_status</text></g>
<g><rect x="1175" y="270" width="320" height="135" class="box"/><line x1="1175" y1="306" x2="1495" y2="306" class="assoc"/><text x="1335" y="295" text-anchor="middle" class="name">SuratBalasan</text><text x="1187" y="327" class="attr">+ id : bigint {PK}</text><text x="1187" y="343" class="attr">+ nomor_surat : string {UK}</text><text x="1187" y="359" class="attr">+ tanggal_terbit : timestamp</text><text x="1187" y="375" class="attr">+ file_path : string</text></g>
<g><rect x="1550" y="270" width="320" height="135" class="box"/><line x1="1550" y1="306" x2="1870" y2="306" class="assoc"/><text x="1710" y="295" text-anchor="middle" class="name">InternApplicationHistory</text><text x="1562" y="327" class="attr">+ id : bigint {PK}</text><text x="1562" y="343" class="attr">+ intern_application_id, actor_id {FK}</text><text x="1562" y="359" class="attr">+ actor_role, decision, notes</text><text x="1562" y="375" class="attr">+ from_status, to_status, decided_at</text></g>
<g><rect x="190" y="475" width="280" height="135" class="box"/><line x1="190" y1="511" x2="470" y2="511" class="assoc"/><text x="330" y="500" text-anchor="middle" class="name">Attendance</text><text x="202" y="532" class="attr">+ id : bigint {PK}</text><text x="202" y="548" class="attr">+ intern_application_id {FK}</text><text x="202" y="564" class="attr">+ date, clock_in_at, clock_out_at</text><text x="202" y="580" class="attr">+ status, verification_status</text></g>
<g><rect x="650" y="475" width="280" height="135" class="box"/><line x1="650" y1="511" x2="930" y2="511" class="assoc"/><text x="790" y="500" text-anchor="middle" class="name">Logbook</text><text x="662" y="532" class="attr">+ id : bigint {PK}</text><text x="662" y="548" class="attr">+ intern_application_id {FK}</text><text x="662" y="564" class="attr">+ verified_by : bigint {FK}</text><text x="662" y="580" class="attr">+ date, description, category, status</text></g>
<g><rect x="1110" y="475" width="280" height="135" class="box"/><line x1="1110" y1="511" x2="1390" y2="511" class="assoc"/><text x="1250" y="500" text-anchor="middle" class="name">Task</text><text x="1122" y="532" class="attr">+ id : bigint {PK}</text><text x="1122" y="548" class="attr">+ assigned_to, created_by {FK}</text><text x="1122" y="564" class="attr">+ division_id {FK}, title, deadline</text><text x="1122" y="580" class="attr">+ status, score, submission_file</text></g>
<g><rect x="1570" y="475" width="280" height="135" class="box"/><line x1="1570" y1="511" x2="1850" y2="511" class="assoc"/><text x="1710" y="500" text-anchor="middle" class="name">Evaluation</text><text x="1582" y="532" class="attr">+ id : bigint {PK}</text><text x="1582" y="548" class="attr">+ intern_application_id, mentor_id {FK}</text><text x="1582" y="564" class="attr">+ score_discipline, score_quality, ...</text><text x="1582" y="580" class="attr">+ final_score, grade_letter</text></g>
<g><rect x="190" y="685" width="280" height="135" class="box"/><line x1="190" y1="721" x2="470" y2="721" class="assoc"/><text x="330" y="710" text-anchor="middle" class="name">Certificate</text><text x="202" y="742" class="attr">+ id : bigint {PK}</text><text x="202" y="758" class="attr">+ intern_application_id {FK}</text><text x="202" y="774" class="attr">+ certificate_number, qr_hash {UK}</text><text x="202" y="790" class="attr">+ pdf_path, issued_at</text></g>
<g><rect x="650" y="685" width="280" height="135" class="box"/><line x1="650" y1="721" x2="930" y2="721" class="assoc"/><text x="790" y="710" text-anchor="middle" class="name">PenilaianKuliah</text><text x="662" y="742" class="attr">+ id : bigint {PK}</text><text x="662" y="758" class="attr">+ intern_application_id, dinilai_oleh {FK}</text><text x="662" y="774" class="attr">+ aspek : string, nilai : decimal</text><text x="662" y="790" class="attr">+ catatan : text</text></g>
<g><rect x="1110" y="685" width="280" height="135" class="box"/><line x1="1110" y1="721" x2="1390" y2="721" class="assoc"/><text x="1250" y="710" text-anchor="middle" class="name">PenilaianSmk</text><text x="1122" y="742" class="attr">+ id : bigint {PK}</text><text x="1122" y="758" class="attr">+ intern_application_id, dinilai_oleh {FK}</text><text x="1122" y="774" class="attr">+ aspek : string, nilai : decimal</text><text x="1122" y="790" class="attr">+ catatan : text</text></g>
<g><rect x="1570" y="685" width="280" height="135" class="box"/><line x1="1570" y1="721" x2="1850" y2="721" class="assoc"/><text x="1710" y="710" text-anchor="middle" class="name">AspekPenilaianSmk</text><text x="1582" y="742" class="attr">+ id : bigint {PK}</text><text x="1582" y="758" class="attr">+ dibuat_oleh : bigint {FK}</text><text x="1582" y="774" class="attr">+ nama, deskripsi</text><text x="1582" y="790" class="attr">+ aktif : boolean</text></g>
<g><rect x="190" y="895" width="280" height="135" class="box"/><line x1="190" y1="931" x2="470" y2="931" class="assoc"/><text x="330" y="920" text-anchor="middle" class="name">InternshipPeriod</text><text x="202" y="952" class="attr">+ id : bigint {PK}</text><text x="202" y="968" class="attr">+ name, start_date, end_date</text><text x="202" y="984" class="attr">+ monthly_quota, registration window</text><text x="202" y="1000" class="attr">+ is_active : boolean</text></g>
<g><rect x="650" y="895" width="280" height="135" class="box"/><line x1="650" y1="931" x2="930" y2="931" class="assoc"/><text x="790" y="920" text-anchor="middle" class="name">Holiday</text><text x="662" y="952" class="attr">+ id : bigint {PK}</text><text x="662" y="968" class="attr">+ date : date</text><text x="662" y="984" class="attr">+ name : string</text><text x="662" y="1000" class="attr">+ description : text</text></g>
<text x="1050" y="1120" text-anchor="middle" class="subtitle">User memiliki relasi mentor, verifikator, pemberi tugas, dan penilai ke kelas terkait.</text>
<text x="1050" y="1150" text-anchor="middle" class="subtitle">Penilaian dan sertifikat terhubung ke InternApplication; relasi mengikuti foreign key database.</text>
<text x="1050" y="1190" text-anchor="middle" class="subtitle">InternshipPeriod dan Holiday tidak memiliki foreign key ke tabel domain lain.</text>
</svg>
